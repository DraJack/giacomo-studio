<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>OG image template — Giacomo Studio</title>
  <!-- Sorgente di og-image.jpg (1200x630). Modifica qui, poi: cd tests && node og.mjs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Instrument+Serif:ital@1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --grad: linear-gradient(90deg, #ff2c32 0%, #fa6800 100%); --ink: #0a0a0a; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #fff; font-family: 'Manrope', sans-serif; color: var(--ink); position: relative; }
    .halo { position: absolute; right: -120px; top: -40px; width: 760px; height: 760px; border-radius: 50%;
      background: radial-gradient(circle, #ffe6da 0%, rgba(255,230,218,.55) 35%, rgba(255,255,255,0) 68%); }
    .logo { position: absolute; top: 54px; left: 72px; font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -.045em; }
    .logo span, .serif { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .copy { position: absolute; left: 72px; top: 150px; width: 740px; }
    .kicker { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #555; margin-bottom: 26px; }
    .kicker::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--grad); }
    h1 { font-family: 'Inter Tight', sans-serif; font-weight: 900; font-size: 92px; line-height: .92; letter-spacing: -.055em; margin-bottom: 30px; }
    .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -.02em; font-size: 1.1em; padding-right: .08em; }
    .sub { font-size: 27px; line-height: 1.35; color: #333; font-weight: 500; }
    .sub b { color: var(--ink); font-weight: 800; }
    .phone { position: absolute; right: 92px; top: 78px; width: 270px; height: 552px; padding: 10px; border-radius: 46px; background: #0b0b0c;
      transform: rotate(-4deg); box-shadow: 0 50px 90px -40px rgba(10,10,10,.45), 0 30px 60px -30px rgba(250,104,0,.4); }
    .phone::before { content: ''; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 80px; height: 22px; border-radius: 20px; background: #0b0b0c; z-index: 2; }
    .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #f6f5f2; padding-top: 34px; }
    .screen img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="halo"></div>
  <div class="logo">giacomo<span>studio</span></div>
  <div class="copy">
    <div class="kicker">Imprese di infissi · Puglia</div>
    <h1>Il sito per la tua<br><span class="serif">impresa di infissi.</span></h1>
    <p class="sub">Lo vedi gratis in 48 ore.<br><b>Paghi 150€ solo se ti piace.</b></p>
  </div>
  <div class="phone">
    <div class="screen"><img src="img/esempio-mobile.webp" alt=""></div>
  </div>
</body>
</html>
