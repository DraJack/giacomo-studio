<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>OG image template — Giacomo Studio</title>
  <!-- Sorgente di og-image.jpg (1200x630). Modifica qui, poi ri-screenshotta a 1200x630. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/clash-display" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{ --grad: linear-gradient(90deg,#ff2c32 0%,#fa6800 100%); }
    body{ width:1200px; height:630px; overflow:hidden; background:#050505;
      font-family:'Inter',sans-serif; color:#fff; position:relative;
      background-image: radial-gradient(ellipse 100% 60% at 50% 0%, #111 0%, #060606 50%, #000 100%); }
    .orb{ position:absolute; top:-260px; left:50%; transform:translateX(-50%);
      width:1100px; height:620px; opacity:.45; border-radius:50%; filter:blur(6px);
      background: radial-gradient(55% 94% at 48.7% 6.5%, #fa6800 0%, #c00000 46%, #0f0f0f 100%); }
    .grid{ position:absolute; inset:0;
      background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:80px 80px; }
    .grid::after{ content:''; position:absolute; inset:0;
      background:linear-gradient(to bottom,transparent 30%,#050505 100%); }
    .wrap{ position:relative; z-index:2; height:100%;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      text-align:center; padding:0 70px; }
    .logo{ font-family:'Clash Display',sans-serif; font-size:26px; font-weight:700;
      letter-spacing:-.02em; position:absolute; top:44px; left:50%; transform:translateX(-50%); }
    .logo span{ background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .badge{ display:inline-flex; align-items:center; gap:9px; margin-bottom:26px;
      padding:8px 18px; border-radius:100px;
      background:rgba(255,165,0,.07); border:1px solid rgba(255,165,0,.30); }
    .badge i{ width:7px;height:7px;border-radius:50%;background:#fa6800;box-shadow:0 0 7px rgba(250,104,0,.8); }
    .badge span{ font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:rgba(255,165,0,.88); }
    h1{ font-family:'Clash Display',sans-serif; font-size:86px; font-weight:700;
      line-height:.95; letter-spacing:-.04em; margin-bottom:24px; }
    h1 em{ font-style:normal; background:var(--grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .kicker{ display:flex;align-items:center;justify-content:center;gap:12px;
      font-size:30px; font-weight:500; color:rgba(255,255,255,.48); letter-spacing:-.01em; margin-bottom:18px;}
    .kicker b{ font-family:'Clash Display',sans-serif; font-size:36px; font-weight:700; letter-spacing:-.02em;
      background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .kicker i{ font-style:normal; color:rgba(255,255,255,.20); }
    .aud{ font-size:19px; color:rgba(255,255,255,.34); letter-spacing:-.01em; }
  </style>
</head>
<body>
  <div class="orb"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="logo">giacomo<span>studio</span></div>
    <div class="badge"><i></i><span>Zero anticipo · paghi solo se ti piace</span></div>
    <h1>Il tuo locale,<br><em>online in 3 giorni.</em></h1>
    <div class="kicker"><b>150€</b><i>·</i><span>Lo vedi finito, poi decidi</span></div>
    <div class="aud">Ristoranti, bar, B&amp;B, palestre e centri estetici in Puglia</div>
  </div>
</body>
</html>
